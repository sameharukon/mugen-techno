<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Techno Live — 意図で操るDJ</title>
<style>
:root{--bg:#0e0f12;--panel:#17191e;--line:#262a31;--fg:#d9dde3;--dim:#7c8592;--acc:#4fd1c5;--acc2:#f6ad55;--red:#e05d5d;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:1040px;margin:0 auto;padding:22px}
h1{font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:.04em}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;user-select:none}
button:hover{border-color:#3a414b}
button.play{background:var(--acc);color:#062522;border-color:var(--acc);font-weight:700;min-width:120px}
button.play.on{background:var(--red);border-color:var(--red);color:#fff}
button.mute{padding:6px 12px;font-size:13px}
button.mute.off{opacity:.35;text-decoration:line-through}
button.drop{font-weight:700}
button.drop.on,button.tog.on{background:var(--red);border-color:var(--red);color:#fff}
button.tog.on{background:#805ad5;border-color:#805ad5}
.vol{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);min-width:200px;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:800px){.cols{grid-template-columns:1fr}}
.intents{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.intents button{padding:9px 6px;font-size:13px}
.say{display:flex;gap:8px;margin-top:10px}.say input{flex:1}
#interp{margin-top:8px;font-size:13px;min-height:20px;color:var(--acc)}
#interp.bad{color:var(--acc2)}
.brks{margin-top:8px;align-items:center}.brks span{font-size:12px;color:var(--dim)}.brks button.on{border-color:var(--acc2);color:var(--acc2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips button{padding:4px 10px;font-size:12px}
.h{font-size:12px;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between}
.styles{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;white-space:nowrap}
.styles .arrow{color:var(--dim);font-weight:400}
.styles .next{color:var(--acc2)}
.prog{height:8px;background:#0b0c0f;border-radius:4px;overflow:hidden;margin:8px 0 4px}.prog>div{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.meters{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;color:var(--dim);margin-top:10px;align-items:center}
.meter{position:relative;height:10px;background:#0b0c0f;border-radius:5px}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--acc)}
.meter>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--acc2)}
#timeline{list-style:none;margin:6px 0 0;padding:0;font-size:12px;max-height:150px;overflow:auto}
#timeline li{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid #1f232a}
#timeline li span:first-child{color:var(--acc2);min-width:70px;font-variant-numeric:tabular-nums}
#history{font-size:11px;color:var(--dim);margin-top:6px}
select,input[type=text]{width:100%;background:#0b0c0f;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}
input[type=range]{width:100%;accent-color:var(--acc)}
#viz{width:100%;height:170px;display:block;background:#0b0c0f;border:1px solid var(--line);border-radius:10px;margin:0 0 12px}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.grid label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
.grid label b{color:var(--fg);font-weight:500}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px}
.row{display:flex;gap:8px;margin-top:6px}.row>*{flex:1}
.mutes{display:flex;gap:6px;flex-wrap:wrap}
.status{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
<h1>TECHNO LIVE — 意図で操るDJ</h1>
<div class="sub">数値ではなく「どうしたいか」を伝えてください。指揮者（コンダクター）がフレーズ単位でDJのように少しずつ変えていきます。ブレイクは種類を指定することも、おまかせにすることもできます。（スペース：再生/停止 ・ K：キック抜き）</div>
<div class="top">
  <button id="play" class="play">▶ スタート</button>
  <button id="drop" class="drop">キック抜き（K）</button>
  <button id="auto" class="tog">おまかせ：オフ</button>
  <div class="vol">音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></div>
  <span class="status" id="status">停止中</span>
</div>
<div class="cols">
  <div class="card">
    <div class="h"><span>意図を伝える</span><span id="holdinfo"></span></div>
    <div class="intents" id="intents"></div>
    <div class="chips brks" id="breaks"><span>ブレイク：</span></div>
    <div class="say"><input id="say" type="text" placeholder="例：少し暗くして一気に盛り上げて／トライバルに／ブレイク入れて"><button id="send">送る</button></div>
    <div id="interp"></div>
    <div class="chips" id="suggest"></div>
    <div id="history"></div>
  </div>
  <div class="card">
    <div class="h"><span>いまの状態</span><span id="phrase">フレーズ — </span></div>
    <div class="styles"><span id="nowStyle">ミニマル</span><span class="arrow" id="arrow"></span><span class="next" id="nextStyle"></span><span class="status" id="bpm" style="margin-left:auto">125 BPM</span></div>
    <div class="prog"><div id="mixbar"></div></div><div class="status" id="mixinfo">ミックスなし</div>
    <div class="meters" id="meters"></div>
    <div class="h" style="margin-top:10px"><span>これからの予定</span></div>
    <ul id="timeline"><li><span>—</span><span>予定なし（ホールド中）</span></li></ul>
  </div>
</div>
<canvas id="viz" width="1900" height="340"></canvas>
<details id="adv"><summary>詳細設定</summary>
<div class="grid">
  <div><label>パートのミュート</label><div class="mutes" id="mutes"></div></div>
  <div><label>スタイルを直接指定（DJミックスで移行）</label><div class="row" style="margin-top:0"><select id="style">
      <option value="minimal">ミニマル</option><option value="hard">ハードテクノ</option><option value="groove">ハードグルーヴ</option>
      <option value="tribal">トライバル</option><option value="broken">ブレイクビート風</option></select><button id="gostyle">移行</button></div></div>
  <div><label>キー（マイナー）</label><select id="key"></select></div>
  <div><label>フィルター（基準）<b id="v-cutoff"></b></label><input id="cutoff" type="range" min="0" max="1" step="0.001" value="0.5">
    <div class="switch"><input id="sweep" type="checkbox" checked><span>16小節のフィルター自動スイープ</span></div></div>
  <div><label>ディレイ ミックス（基準）<b id="v-dmix"></b></label><input id="dmix" type="range" min="0" max="1" step="0.01" value="0.35"></div>
  <div><label>ディレイ フィードバック（基準）<b id="v-dfb"></b></label><input id="dfb" type="range" min="0" max="0.85" step="0.01" value="0.42"></div>
  <div><label>バリエーション（基準）<b id="v-var"></b></label><input id="var" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div><label>ブレイクを選んで入れる</label><select id="brktype"></select>
    <div class="row"><select id="brklen"><option value="0" selected>長さ：おすすめ</option><option value="1">1小節</option><option value="2">2小節</option><option value="4">4小節</option><option value="8">8小節</option><option value="16">16小節</option></select>
      <button id="gobrk">入れる</button></div><div class="status" id="brkdesc"></div></div>
  <div><label>ブレイクの演出</label>
    <div class="switch"><input id="fill" type="checkbox" checked><span>復帰前にフィル</span></div>
    <div class="switch"><input id="riser" type="checkbox" checked><span>ライザー（ハイパス＋ノイズ）</span></div>
    <div class="switch"><input id="crash" type="checkbox" checked><span>復帰の1拍目にクラッシュ</span></div></div>
  <div><label>定期的な自動キック抜き</label>
    <div class="switch"><input id="autodrop" type="checkbox"><span>オン</span></div>
    <div class="row"><select id="autoevery"><option value="16">16小節ごと</option><option value="32" selected>32小節ごと</option><option value="64">64小節ごと</option></select>
      <select id="autolen"><option value="rand" selected>ランダム</option><option value="1">1小節</option><option value="2">2小節</option><option value="4">4小節</option><option value="8">8小節</option></select></div></div>
  <div><label>デバッグ</label><div class="status" id="seedinfo">シード：スタート時にランダム</div></div>
</div></details>
</main>
<script>
"use strict";
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const KEYS=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const MINOR_PENT=[0,3,5,7,10];
const PARTS=["kick","hat","clap","perc","bass","stab"];
const PART_JA={kick:"キック",hat:"ハット",clap:"クラップ",perc:"パーカッション",bass:"ベース",stab:"上モノ"};
const STYLES={minimal:{ja:"ミニマル",bpm:125},hard:{ja:"ハードテクノ",bpm:142},groove:{ja:"ハードグルーヴ",bpm:134},tribal:{ja:"トライバル",bpm:128},broken:{ja:"ブレイクビート風",bpm:128}};
// base settings (詳細設定). The conductor's intent parameters modulate these.
const S={key:9,cutoff:0.5,sweep:true,dmix:0.35,dfb:0.42,variation:0.5,vol:0.8,style:"minimal",
  dropManual:false,fill:true,riser:true,crash:true,autoDrop:false,autoEvery:32,autoLen:"rand",
  mute:{kick:false,hat:false,clap:false,perc:false,bass:false,stab:false}};
const cutoffHz=v=>Math.round(120*Math.pow(2000/120,v));
const keyOff=()=>(((S.key-9)+17)%12-5);
const mtof=m=>440*Math.pow(2,(m-69)/12);

// ---------- Break library ----------
// each break: length range (bars), default length, energy range where it fits, tension it creates, whether the
// classic snare fill / crash is used on the return. Part masks + effects live in Engine.breakMask / dropStart / armReturn.
const BREAKS={
  kick:     {ja:"キック抜き",len:[1,8],def:2,energy:[0,1],tension:.5,fill:true,crash:true,desc:"キックだけ抜いてライザーで溜める"},
  breakdown:{ja:"フルブレイクダウン",len:[8,16],def:8,energy:[.3,1],tension:.9,fill:false,crash:true,desc:"ドラム・ベースが抜けて上モノ＋パッドだけ、最後の2小節でスネアロール＋ライザー"},
  filter:   {ja:"フィルターブレイク",len:[2,8],def:4,energy:[0,.85],tension:.4,fill:true,crash:true,desc:"マスターLPFで隣の部屋のようにこもらせ、最後の1拍で開く"},
  hpbuild:  {ja:"ハイパスビルド",len:[2,8],def:4,energy:[.35,1],tension:.8,fill:false,crash:true,desc:"HPFで全体を少しずつ細くし、最後の小節はキックとベースを抜いてドロップ"},
  bassonly: {ja:"ベースだけ",len:[2,4],def:2,energy:[.3,1],tension:.4,fill:true,crash:true,desc:"キック＋ベースだけを残す"},
  perconly: {ja:"パーカッションだけ",len:[2,4],def:2,energy:[0,.85],tension:.35,fill:true,crash:true,desc:"ハット・クラップ・パーカッションだけを残す"},
  tapestop: {ja:"テープストップ",len:[1,1],def:1,energy:[.3,1],tension:.6,fill:false,crash:true,desc:"後半2拍で全体がピッチダウンして止まり、次の1拍目で再始動"},
  stutter:  {ja:"スタッター",len:[1,1],def:1,energy:[.35,1],tension:.7,fill:false,crash:true,desc:"後半2拍を8分→16分→32分で連打（ビートリピート）"},
  echo:     {ja:"エコーアウト",len:[1,2],def:1,energy:[0,1],tension:.5,fill:false,crash:true,desc:"ドライを切ってダブ・ディレイの残響だけを残す"},
  halftime: {ja:"ハーフタイム",len:[4,8],def:4,energy:[.3,1],tension:.45,fill:true,crash:true,desc:"キック1拍目・スネア3拍目の半分のノリ、ベースも半分の速さに"},
  silence:  {ja:"サイレンス",len:[1,1],def:1,energy:[.3,1],tension:.7,fill:false,crash:true,desc:"最後の1拍だけほぼ無音にしてドロップ"}};
const BREAK_ORDER=Object.keys(BREAKS);
const M_ALL={k:1,h:1,c:1,p:1,b:1,u:1},M_NONE={k:0,h:0,c:0,p:0,b:0,u:0};
// style affinity for automatic choice
const BREAK_AFFINITY={minimal:{filter:1.6,echo:1.5,perconly:1.4,kick:1.2},hard:{tapestop:1.6,stutter:1.5,hpbuild:1.5,silence:1.4},
  groove:{bassonly:1.5,stutter:1.4,filter:1.3,perconly:1.3},tribal:{perconly:1.7,halftime:1.4,breakdown:1.3,echo:1.2},broken:{halftime:1.6,stutter:1.4,echo:1.3,tapestop:1.2}};

// ---------- Pattern generator ----------
class Patterns{
  constructor(rand){this.r=rand;this.bar=0;this.ghost=0.35;this.openHat=false;this.init();}
  init(){
    const r=this.r;
    const base=[[2,0,0],[3,0,0],[6,0,1],[7,0,0],[10,1,0],[11,0,0],[14,3,-1],[15,0,0]];
    this.bass=Array.from({length:16},()=>null);
    for(const [s,d,o] of base) this.bass[s]={deg:d,oct:o};
    this.stab=new Set([3]);this.stabAlt=new Set([11,14]);
    this.hatAccent=Array.from({length:16},()=>0.8+0.25*r());
    // hard groove: extra kick probability + shaker probabilities
    this.grooveExtra=0.35;
    this.shaker=Array.from({length:16},(_,s)=>s%4===2?0.95:(s%2?0.55:0.3));
    // tribal: 3-over-4 cycle + 12/8-feel accents (3+3+2 / 3+3+3+3+4)
    this.trib={cyc:3,off:0,voiceA:1,b:[0,-1,-1,2,-1,-1,0,-1,1,-1,-1,2,-1,-1,1,-1],prob:0.85,ghost:0.15};
    // broken kick
    this.broken=new Set([0,6,10]);
    this.initUpper();
  }
  mutate(v){
    const r=this.r;
    for(let s=0;s<16;s++){
      if(r()>v*0.35) continue;
      const down=s%4===0;
      if(this.bass[s]){
        if(r()<0.35 && s!==2) this.bass[s]=null;
        else this.bass[s]={deg:r()<0.5?0:Math.floor(r()*MINOR_PENT.length),oct:r()<0.15?1:(r()<0.1?-1:0)};
      }else if(!down || r()<0.08){
        this.bass[s]={deg:r()<0.6?0:Math.floor(r()*MINOR_PENT.length),oct:r()<0.12?1:0};
      }
    }
    let n=this.bass.filter(Boolean).length;
    while(n<4){const s=[2,6,10,14,3,11][Math.floor(r()*6)];if(!this.bass[s]){this.bass[s]={deg:0,oct:0};n++;}}
    while(n>10){const s=Math.floor(r()*16);if(this.bass[s]&&s!==2){this.bass[s]=null;n--;}}
    this.ghost=Math.min(0.75,Math.max(0.05,this.ghost+(r()-0.5)*0.5*v));
    this.hatAccent=this.hatAccent.map(a=>Math.min(1.1,Math.max(0.6,a+(r()-0.5)*0.3*v)));
    const reroll=set=>{const k=1+Math.floor(r()*(v>0.6?3:2));set.clear();
      for(let i=0;i<k;i++)set.add([3,6,7,10,11,13,14,15][Math.floor(r()*8)]);};
    if(r()<v*0.8) reroll(this.stab);
    if(r()<v*0.8) reroll(this.stabAlt);
    // groove
    this.grooveExtra=Math.min(0.8,Math.max(0.1,this.grooveExtra+(r()-0.5)*0.5*v));
    this.shaker=this.shaker.map((p,s)=>s%4===2?p:Math.min(0.9,Math.max(0.05,p+(r()-0.5)*0.5*v)));
    // tribal
    const T=this.trib;
    if(r()<v*0.6){T.cyc=r()<0.75?3:(r()<0.5?5:6);T.off=Math.floor(r()*T.cyc);T.voiceA=Math.floor(r()*3);}
    if(r()<v*0.7){const rot=Math.floor(r()*4)*2;T.b=T.b.slice(rot).concat(T.b.slice(0,rot));}
    for(let s=0;s<16;s++) if(r()<v*0.15) T.b[s]=T.b[s]<0?Math.floor(r()*3):-1;
    T.prob=Math.min(1,Math.max(0.55,T.prob+(r()-0.5)*0.3*v));
    T.ghost=Math.min(0.45,Math.max(0.05,T.ghost+(r()-0.5)*0.3*v));
    // broken kick (always keeps the downbeat)
    if(r()<v*0.7){const opts=[[0,6,10],[0,3,10],[0,7,10,13],[0,6,8,11],[0,3,8,10,14],[0,10],[0,6,11,14]];
      this.broken=new Set(opts[Math.floor(r()*opts.length)]);}
  }
  nextBar(v){
    if(this.bar>0 && this.bar%4===0){this.mutate(v);this.mutateUpper(v);}
    if(this.bar%8===0) this.openHat = this.bar%16===8 ? true : (this.r()<0.3+0.4*v);
    return this.bar++;
  }
}

// ---------- AudioParam envelope helper ----------
// Mirrors the automation we schedule so we can hold the exact current value
// (cancelAndHoldAtTime where supported, otherwise cancelScheduledValues + computed value).
class Env{
  constructor(param,v0){this.p=param;this.ev=[{type:"set",time:0,value:v0}];param.setValueAtTime(v0,0);}
  valueAt(T){let v=this.ev[0].value,pt=this.ev[0].time,tgt=null;
    for(const e of this.ev){
      if(e.time>T){ if(e.type==="lin") return v+(e.value-v)*(T-pt)/(e.time-pt);
        if(e.type==="exp") return v*Math.pow(e.value/v,(T-pt)/(e.time-pt)); break;}
      if(tgt) v=tgt.value+(v-tgt.value)*Math.exp(-(e.time-pt)/tgt.tau);
      tgt=null;
      if(e.type==="target"){tgt=e;}else v=e.value;
      pt=e.time;}
    if(tgt) v=tgt.value+(v-tgt.value)*Math.exp(-(T-pt)/tgt.tau);
    return v;}
  hold(t,floor=0){const v=Math.max(floor,this.valueAt(t));
    // inside a ramp, cancelScheduledValues would drop the ramp's end point -> use cancelAndHoldAtTime.
    // otherwise (after a set/target event) the computed value is exact and works in every browser.
    const midRamp=this.ev.some((e,i)=>(e.type==="lin"||e.type==="exp")&&e.time>t&&i>0&&this.ev[i-1].time<t);
    if(midRamp&&this.p.cancelAndHoldAtTime&&floor===0){this.p.cancelAndHoldAtTime(t);}
    else{this.p.cancelScheduledValues(t);this.p.setValueAtTime(v,t);}
    this.ev=this.ev.filter(e=>e.time<t);this.ev.push({type:"set",time:t,value:v});
    if(this.ev.length>12)this.ev=this.ev.slice(-12);return v;}
  exp(v,t){this.p.exponentialRampToValueAtTime(v,t);this.ev.push({type:"exp",time:t,value:v});}
  lin(v,t){this.p.linearRampToValueAtTime(v,t);this.ev.push({type:"lin",time:t,value:v});}
  set(v,t){this.p.setValueAtTime(v,t);this.ev=this.ev.filter(x=>x.time<t);this.ev.push({type:"set",time:t,value:v});}
  target(v,t,tau){this.p.setTargetAtTime(v,t,tau);this.ev.push({type:"target",time:t,value:v,tau});}
}

// ---------- Engine (AudioContext or OfflineAudioContext) ----------
class Engine{
  constructor(ctx,seed){
    this.ctx=ctx;this.seed=seed;this.rand=mulberry32(seed);this.deckSeq=0;this.debug=false;this.kickLog=[];this.bassLog=[];this.bpmLog=[];
    const c=ctx;
    const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);
    const nr=mulberry32(seed^0x9e3779b9);for(let i=0;i<d.length;i++)d[i]=nr()*2-1;
    this.noise=nb;
    // master: sum -> highpass (drop riser) -> volume -> soft clip -> limiter -> out
    this.sum=c.createGain();this.sum.gain.value=0.8;
    this.hpf=c.createBiquadFilter();this.hpf.type="highpass";this.hpf.frequency.value=0;this.hpf.Q.value=0.8;

// ---------- Upper layer (上モノ) : per-style palettes ----------

const VOWELS=[[800,1150,2900],[450,800,2830],[400,1600,2700],[300,2000,2900],[350,600,2700]];

Object.assign(Patterns.prototype,{
  initUpper(){const r=this.r;

      tribal:{arp:[0,2,3,1,4,2],cycA:3,cycB:5,offB:2,pB:0.5,flute:0.6},

  mutateUpper(v){const r=this.r,U=this.U;
    const pick=(arr,k)=>{const s=new Set();for(let i=0;i<k;i++)s.add(arr[Math.floor(r()*arr.length)]);return s;};

  upCut(){const l=this.lfo();return {l,k:Math.sqrt(this.cutHz()/490)*(0.55+0.9*l)};},

// ---------- Conductor: intents -> gradual, phrase-aligned musical changes ----------
const PROFILE={
  minimal:{energy:.40,dark:.45,density:.45,swing:.10,tension:.20,space:.55},
  hard:   {energy:.85,dark:.75,density:.70,swing:.05,tension:.35,space:.30},
  groove: {energy:.70,dark:.35,density:.70,swing:.55,tension:.30,space:.35},
  tribal: {energy:.60,dark:.45,density:.60,swing:.30,tension:.30,space:.70},
  broken: {energy:.60,dark:.50,density:.55,swing:.20,tension:.30,space:.50}};

  groove:{hard:.4,tribal:.25,minimal:.2,broken:.15},hard:{groove:.35,broken:.25,minimal:.25,tribal:.15},broken:{minimal:.35,groove:.3,tribal:.2,hard:.15}};

const BREAK_WORDS=[["tapestop",/テープ|ピッチダウン|ストップ/],["stutter",/スタッター|ビートリピート|リピート|連打/],["echo",/エコー|ダブアウト|残響だけ/],
  ["halftime",/ハーフタイム|ハーフ|半分のノリ/],["silence",/サイレンス|無音|静寂|一瞬止/],["hpbuild",/ハイパス/],["filter",/フィルター|こもら|こもっ|隣の部屋|ローパス/],
  ["breakdown",/ブレイクダウン|ブレークダウン|長めのブレイク|長いブレイク|大きいブレイク|大きなブレイク|ドラムを?抜/],["bassonly",/ベースだけ|ベースのみ/],
  ["perconly",/パーカッションだけ|パーカスだけ|打楽器だけ|リズムだけ/],["kick",/キック抜|キックを抜|キックだけ抜/]];

    if(o.forMix)c=c.filter(k=>["kick","filter","hpbuild","tapestop","stutter","echo","silence","breakdown"].includes(k)&&(k!=="breakdown"||o.long)&&(BREAKS[k].len[0]<=(o.maxLen||2)||BREAKS[k].len[1]===1));

    if(o.long)c=c.filter(k=>BREAKS[k].len[1]>=8);

      case "swap":{if(!M||!M.deckB)break;e.low=M.deckB;M.state="swapped";
        M.deckA.topEnv.hold(t);M.deckA.topEnv.lin(0,t+bd*M.L/4);M.deckB.topEnv.hold(t);M.deckB.topEnv.lin(1,t+bd*2);
        e.trimEnv.hold(t);e.trimEnv.lin(Math.pow(10,STYLE_TRIM_DB[M.to]/20),t+bd*2);
        if(!M.dropLen&&S.crash&&this.p.energy>0.45)e.crash(t);
        this.note(`キック＋ベースを${this.ja(M.to)}に交換`);break;}
      case "mixEnd":{if(!M)break;const A=M.deckA;e.decks=e.decks.filter(d=>d!==A);e.disposeDeck(A,t);
        e.upHpEnv[M.from].hold(t);e.upHpEnv[M.from].exp(20,t+0.5);
        this.note(`${this.ja(M.to)}へのミックス完了`);this.mix=null;break;}
      case "peakHit":this.setParam("tension",0.25,8,bar);this.note("ピーク");break;
    }}

  autopilot(bar){if(this.mix||this.queue.length)return;
    const r=this.r;this.phraseCount++;
    if(this.phraseCount>=this.autoWait){
      const W=JOURNEY[this.e.low.style];let x=r()*Object.values(W).reduce((a,b)=>a+b,0),pick="minimal";
      for(const [k,w] of Object.entries(W)){x-=w;if(x<=0){pick=k;break;}}
      const L=r()<0.5?16:32,dl=L===32&&r()<0.3?8:(this.p.energy>0.55?2:(r()<0.6?1:0));
      this.planMix(pick,bar,{len:L,gap:1,dropLen:dl});
      this.note(`おまかせ：次は${this.ja(pick)}（${L}小節ミックス）`);
      this.phraseCount=0;this.autoWait=this.autoWaitRange[0]+Math.floor(r()*(this.autoWaitRange[1]-this.autoWaitRange[0]+1));
    }else{
      const ph=bar/16;
      this.setParam("energy",this.p.energy+(Math.sin(ph*0.9)*0.15+(r()-0.5)*0.15),16,bar);
      this.setParam("dark",this.p.dark+(r()-0.5)*0.2,16,bar);this.setParam("density",this.p.density+(r()-0.5)*0.2,16,bar);
      if(r()<0.4){const ls=[];this.planBreak(bar,null,ls,null,null,{});}
    }}

  // ---- free-text (Japanese) intent parser: rule-based keywords + intensity words ----
  intent(text){
    const tx=String(text).normalize("NFKC").toLowerCase(),bar=this.bar,labels=[];let k=1,fast=false,slow=false,hit=false;
    if(/少し|ちょっと|やや|ちょい|わずか|軽く|気持ち/.test(tx)){k=0.5;slow=true;}
    if(/かなり|すごく|めっちゃ|とても|超|思いっきり|思い切り|がっつり|ガッツリ|最大|全開/.test(tx))k=1.6;
    if(/一気に|今すぐ|すぐ|急に|即|いきなり/.test(tx)){fast=true;k=Math.max(k,1.4);}
    const gb=fast?2:(slow?16:8),start=fast?bar+1:this.nextBoundary(bar,4,1);
    const mixO={len:fast?8:(slow?32:16),grid:fast?8:16,gap:fast?1:2,dropLen:fast?1:(slow?0:2)};
    const arrows=d=>(d>0?"↑":"↓").repeat(Math.abs(d)>0.35?2:1);
    const delta=(key,d)=>{const to=this.target(key)+d*k;this.setParam(key,to,gb,start);labels.push(`${PARAM_JA[key]}${arrows(d*k)}`);hit=true;};
    const style=st=>{this.requestStyle(st,mixO,labels);hit=true;};
    let t2=tx.replace(/ハードグル[ーｰ]?[ヴブ]/g,"グルーヴ");
    if(/(おまかせ|お任せ|自動|オート).*(やめ|オフ|解除|止め|終わ)|手動に/.test(t2)){this.auto=false;labels.push("おまかせ オフ");hit=true;t2=t2.replace(/おまかせ|お任せ|自動|オート/g,"");}
    else if(/おまかせ|お任せ|任せ|自動|オート|djして|勝手に/.test(t2)){this.auto=true;this.hold=false;labels.push("おまかせ オン（数フレーズごとに自動でスタイル移行）");hit=true;}
    if(/このまま|キープ|維持|ずっと|固定|変えないで/.test(t2)){this.hold=true;this.auto=false;this.glide={};this.queue=[];
      if(this.mix&&this.mix.state==="planned")this.mix=null;           // not started yet -> cancel
      this.events=this.events.filter(e=>this.mix&&["mixStart","upOut","drop","swap","mixEnd"].includes(e.type));
      labels.push("ホールド：今の状態をキープ（進行中のミックスのみ完了させる）");return {ok:true,labels,hold:true};}
    this.hold=false;
    if(/テンポ.*(上|速|早|アップ)|速く|早く/.test(t2)){this.tempoBias+=3*k;this.retempo(bar);labels.push(`テンポ↑（+${(3*k).toFixed(0)} BPM を8小節かけて）`);hit=true;t2=t2.replace(/テンポ.*?(上げ|上|速|早|アップ)/,"");}
    else if(/テンポ.*(下|遅|ダウン)|遅く|ゆっくり/.test(t2)){this.tempoBias-=3*k;this.retempo(bar);labels.push(`テンポ↓（-${(3*k).toFixed(0)} BPM を8小節かけて）`);hit=true;t2=t2.replace(/テンポ.*?(下げ|下|遅|ダウン)/,"");}
    let brokenHit=false;
    if(/ブレイクビート|変則|エレクトロ|ブロークン|崩して|崩す/.test(t2)){style("broken");brokenHit=true;}
    if(/ハード|激しく|激しい|硬く|インダストリアル|ゴリゴリ|攻撃的|アグレッシブ/.test(t2)){style("hard");delta("energy",0.2);delta("dark",0.15);}
    if(/グルーヴ|グルーブ|ファンキー|ファンク/.test(t2))style("groove");
    if(/グルーヴ|グルーブ|ファンキー|ファンク|ノリ|跳ね|スウィング|スイング|シャッフル|うねり/.test(t2))delta("swing",0.3);
    if(/トライバル|民族|土着|呪術|ジャングル|アフロ|太鼓|パーカッシブ/.test(t2))style("tribal");
    if(/ミニマル|元に戻|最初の/.test(t2))style("minimal");
    if(/シンプル|すっきり/.test(t2))delta("density",-0.25);
    if(/ピーク|頂点|クライマックス|最高潮|爆発|山場/.test(t2)){this.planPeak(bar,k,labels);labels.unshift("エネルギー↑↑ 緊張感↑↑");hit=true;}
    else{let bt=null;for(const [key,re] of BREAK_WORDS)if(re.test(t2)){bt=key;t2=t2.replace(re,"");break;}
      const isB=/ブレイク|ブレーク|抜いて|抜き|休憩|溜めて/.test(t2),shortB=/短い|短め|一瞬|軽く/.test(tx)||k<1,longB=/長い|長め|大きい|大きな|がっつり|ガッツリ/.test(tx)||k>1.2;
      if(bt){this.planBreak(bar,null,labels,null,bt,{short:shortB,long:longB});hit=true;}
      else if(!brokenHit&&isB){this.planBreak(bar,null,labels,null,null,{short:shortB,long:longB});hit=true;}}
    if(/盛り上げ|盛り上が|上げて|アゲ|あげて|テンション|エネルギー|熱く|アツく|攻めて/.test(t2)){delta("energy",0.25);delta("density",0.12);}
    if(/落ち着|静か|クール|チル|下げて|穏やか|リラックス|抑え|おとなしく|大人しく|まったり|ゆったり/.test(t2)){delta("energy",-0.25);delta("density",-0.15);delta("tension",-0.2);delta("space",0.1);}
    if(/暗く|暗い|ダーク|闇|重く|重い|不穏|怪しく|シリアス/.test(t2))delta("dark",0.3);
    if(/明るく|明るい|ブライト|爽やか|開放|キラキラ|ハッピー|軽やか/.test(t2))delta("dark",-0.3);
    if(/緊張|ビルド|煽|焦ら|じらし/.test(t2))delta("tension",0.3);
    if(/広く|広げ|空間|深く|ダブ|リバーブ|響か|奥行/.test(t2))delta("space",0.3);
    if(/ドライ|タイト|近く|締め/.test(t2))delta("space",-0.3);
    if(/密度|詰め|賑やか|手数|忙し|厚く|派手/.test(t2))delta("density",0.3);
    if(/スカスカ|減らし|間引|少なく|薄く|削/.test(t2))delta("density",-0.3);
    if(!hit)return {ok:false,labels:[],suggest:SUGGEST};
    const speed=fast?"一気に":(slow?"少しずつ":"");
    if(labels.some(l=>/[↑↓]/.test(l))&&!/ピーク/.test(labels.join("")))labels.push(`${speed}${fast?"次の小節から":"次の4小節境界から"}${gb}小節かけて変化`);
    this.note("意図：「"+text+"」");
    return {ok:true,labels};}
}

// ---------- Live transport (worker-tick lookahead scheduler) ----------
const LOOKAHEAD=0.1,TICK_MS=25;
let ctx=null,eng=null,ticker=null,playing=false,pendingIntents=[],autoWanted=false;
function makeTicker(fn){
  try{const src="let id=null;onmessage=e=>{if(e.data==='start'){clearInterval(id);id=setInterval(()=>postMessage('t'),"+TICK_MS+");}else{clearInterval(id);id=null;}};";
    const w=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));w.onmessage=fn;
    return {kind:"worker",start(){w.postMessage("start");},stop(){w.postMessage("stop");}};
  }catch(e){let id=null;return {kind:"timer",start(){id=setInterval(fn,TICK_MS);},stop(){clearInterval(id);}};}
}
function tick(){if(!playing) return;
  const now=ctx.currentTime;
  if(eng.nextTime<now-0.2) eng.nextTime=now+0.05;
  eng.minLead=Math.min(eng.minLead,eng.nextTime-now);
  while(eng.nextTime<now+LOOKAHEAD){eng.scheduleStep(eng.nextTime);eng.nextTime+=eng.s16;}
}
async function start(){
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
  if(ctx.state!=="running") await ctx.resume();
  const seed=(Math.random()*4294967296)>>>0;
  S.style="minimal";
  eng=new Engine(ctx,seed);eng.onStep=queueViz;eng.cond.auto=autoWanted;
  $("seedinfo").textContent="シード："+seed;
  eng.nextTime=ctx.currentTime+0.06;
  if(!ticker) ticker=makeTicker(tick);
  playing=true;ticker.start();tick();setPlayUI(true);
  for(const t of pendingIntents.splice(0)) sendIntent(t);
}
function stop(){
  playing=false;if(ticker)ticker.stop();
  if(eng){const e=eng,t=ctx.currentTime;e.out.gain.setTargetAtTime(0,t,0.02);e.riserBus.gain.setTargetAtTime(0,t,0.02);e.dispose(t+0.3);setTimeout(()=>{try{e.out.disconnect();e.riserBus.disconnect();}catch(_){}},400);}
  eng=null;vizQ.length=0;setPlayUI(false);
}

PARTS.forEach(p=>{const b=document.createElement("button");b.className="mute";b.textContent=PART_JA[p];b.dataset.part=p;
  b.addEventListener("click",()=>{S.mute[p]=!S.mute[p];b.classList.toggle("off",S.mute[p]);if(eng)eng.applyParams();});$("mutes").appendChild(b);});
let dropDownAt=0,dropArmedByThisPress=false;
function setDrop(on){S.dropManual=on;$("drop").classList.toggle("on",on);$("drop").textContent=on?"キック抜き中…（K）":"キック抜き（K）";}
function dropDown(){if(S.dropManual){setDrop(false);dropArmedByThisPress=false;}else{setDrop(true);dropArmedByThisPress=true;dropDownAt=performance.now();}}
function dropUp(){if(dropArmedByThisPress&&performance.now()-dropDownAt>350)setDrop(false);dropArmedByThisPress=false;}
$("drop").addEventListener("pointerdown",e=>{e.preventDefault();dropDown();});
$("drop").addEventListener("pointerup",dropUp);$("drop").addEventListener("pointerleave",()=>{if(dropArmedByThisPress)dropUp();});
$("fill").addEventListener("change",e=>S.fill=e.target.checked);
$("riser").addEventListener("change",e=>S.riser=e.target.checked);
$("crash").addEventListener("change",e=>S.crash=e.target.checked);
$("autodrop").addEventListener("change",e=>S.autoDrop=e.target.checked);
$("autoevery").addEventListener("change",e=>S.autoEvery=+e.target.value);
$("autolen").addEventListener("change",e=>S.autoLen=e.target.value);
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"&&e.target.type==="text")return;
  if(e.code==="Space"){e.preventDefault();$("play").click();}
  else if(e.code==="KeyK"&&!e.repeat){e.preventDefault();dropDown();}});
document.addEventListener("keyup",e=>{if(e.code==="KeyK")dropUp();});

// ---------- Test hook: offline render with scripted intents (not used by UI) ----------
window.__renderOffline=async function(o){
  const saved=JSON.stringify(S);S.style=o.style||"minimal";
  try{const sr=44100,bars=o.bars,est=bars*16*60/(o.minBpm||120)/4+2;
    const oc=new OfflineAudioContext(2,Math.ceil(sr*est),sr),e=new Engine(oc,o.seed>>>0);e.debug=true;
    if(o.auto){e.cond.auto=true;if(o.autoWaitRange)e.cond.autoWaitRange=o.autoWaitRange;e.cond.autoWait=e.cond.autoWaitRange[0];}
    const intents=[...(o.intents||[])],res=[],swaps=[];let t=0.01,lastLow=e.low.id;
    e.onStep=(s,tt)=>{if(s===0&&e.low.id!==lastLow){swaps.push([tt,lastLow,e.low.id]);lastLow=e.low.id;}};
    // schedule incrementally (like the live lookahead scheduler) using suspend/resume, so the graph stays small
    const schedUntil=lim=>{while(e.step<bars*16&&t<lim){const b=Math.floor(e.step/16);
      if(e.step%16===8)while(intents.length&&intents[0].bar<=b){const it=intents.shift();res.push({bar:b,text:it.text,...e.cond.intent(it.text)});}
      if(o.manualDrop)S.dropManual=b>=o.manualDrop[0]&&b<o.manualDrop[1];
      e.scheduleStep(t);t+=e.s16;}};
    schedUntil(1.5);
    for(let k=1;k<est-0.5;k+=1){oc.suspend(k).then(()=>{schedUntil(k+1.5);oc.resume();});}
    const buf=await oc.startRendering();const end=t;
    const L=buf.getChannelData(0),R=buf.getChannelData(1),n=Math.min(L.length,Math.ceil(end*sr));let pk=0,ss=0,nan=0;
    for(const x of [L,R])for(let i=0;i<n;i++){const v=x[i];if(!Number.isFinite(v)){nan++;continue;}pk=Math.max(pk,Math.abs(v));ss+=v*v;}
    // per-16-bar RMS
    const seg=[];{let i0=0;for(const [bar,bpm] of e.bpmLog.filter(x=>x[0]%16===0)){}}
    // kick double / flam check
    const kl=e.kickLog;let minGap=Infinity,diffDeckNear=0;for(let i=1;i<kl.length;i++){const d=kl[i][0]-kl[i-1][0];minGap=Math.min(minGap,d);if(d<0.06&&kl[i][1]!==kl[i-1][1])diffDeckNear++;}
    // bass overlap: any note from a deck other than the current low owner, or two decks within 1/16
    const bl=e.bassLog;let bassDiffNear=0,bassOldAfterSwap=0;for(let i=1;i<bl.length;i++){if(bl[i][1]!==bl[i-1][1]&&bl[i][0]-bl[i-1][0]<0.1)bassDiffNear++;}
    for(const [ts,from] of swaps)bassOldAfterSwap+=bl.filter(x=>x[1]===from&&x[0]>=ts-1e-6).length;
    let maxBpmStep=0;for(let i=1;i<e.bpmLog.length;i++)maxBpmStep=Math.max(maxBpmStep,Math.abs(e.bpmLog[i][1]-e.bpmLog[i-1][1]));
    const segs=[];const per=(bar)=>{const row=e.bpmLog[bar];return row;};
    // RMS per 16 bars using bar start times
    const barT=[];{let tt=0.01;for(const row of e.bpmLog){barT.push(tt);tt+=16*60/row[1]/4;}}
    for(let b=0;b+16<=barT.length;b+=16){const i0=Math.floor(barT[b]*sr),i1=Math.floor((barT[b+16]||end)*sr);let s2=0;for(let i=i0;i<i1;i++)s2+=L[i]*L[i]+R[i]*R[i];
      segs.push({bars:`${b}-${b+15}`,style:e.bpmLog[b][2],decks:e.bpmLog[b+8][3],rmsDb:+(10*Math.log10(s2/(2*(i1-i0)))).toFixed(1)});}
    return {seconds:+end.toFixed(1),peakDb:+(20*Math.log10(pk)).toFixed(2),rmsDb:+(10*Math.log10(ss/(2*n))).toFixed(2),nan,
      kicks:kl.length,minKickGap:+minGap.toFixed(4),kicksFromTwoDecksNear:diffDeckNear,bassNotes:bl.length,bassTwoDecksNear:bassDiffNear,bassOldDeckAfterSwap:bassOldAfterSwap,
      swaps:swaps.map(x=>+x[0].toFixed(2)),maxBpmStepPerBar:+maxBpmStep.toFixed(3),
      bpmPath:e.bpmLog.filter((x,i)=>i%4===0).map(x=>`${x[0]}:${x[1].toFixed(1)}:${x[3]}`).join(" "),segs,breaks:e.breakLog.map(x=>`${x.type}@${x.bar}x${x.len}`),intents:res,history:e.cond.history.slice().reverse().map(h=>`[${h.bar}] ${h.msg}`)};
  }finally{Object.assign(S,JSON.parse(saved));}
};
